name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & Build ExpenseTracker
        run: dotnet build projects/ExpenseTracker/ExpenseTracker.slnx --configuration Release --nologo

      - name: Restore & Build WeatherAPI
        run: dotnet build projects/WeatherAPI/WeatherAPI.slnx --configuration Release --nologo

      - name: Restore & Build PersonalBlog
        run: dotnet build projects/PersonalBlog/PersonalBlog.sln --configuration Release --nologo

      - name: Restore & Build TaskTrackerCLI
        run: dotnet build projects/TaskTrackerCLI/TaskTrackerCLI.slnx --configuration Release --nologo
